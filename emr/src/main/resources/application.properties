spring.application.name=${NAME:EMR}
server.port=${PORT:8080}
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION:86400000}
spring.mongodb.uri=${MONGODB_SRV}
spring.docker.compose.enabled=${SPRING_DOCKER_COMPOSE:false}
app.admin.password=${ADMIN_PASSWORD:12345678}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
